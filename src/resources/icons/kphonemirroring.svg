<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="pmMon" x1="0" y1="6" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d99f3"/>
    </linearGradient>
    <linearGradient id="pmPhone" x1="0" y1="16" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1abc9c"/>
      <stop offset="100%" stop-color="#1d99f3"/>
    </linearGradient>
    <linearGradient id="pmBody" x1="0" y1="13" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a3f45"/>
      <stop offset="100%" stop-color="#232629"/>
    </linearGradient>
  </defs>
  <!-- Monitor stand & base -->
  <rect x="16" y="30" width="8" height="5" fill="#7f8c8d"/>
  <rect x="11" y="35" width="18" height="2.5" rx="1" fill="#bdc3c7"/>
  <!-- Monitor frame & screen -->
  <rect x="4" y="6" width="32" height="24" rx="2" fill="#31363b"/>
  <rect x="6" y="8" width="28" height="20" rx="1" fill="url(#pmMon)"/>
  <path d="M6,8 H24 L13,28 H6 Z" fill="#ffffff" opacity="0.12"/>
  <!-- Cast arrows inside monitor -->
  <path d="M11,16 H20 V13.5 L24,17.5 L20,21.5 V19 H11 Z" fill="#fcfcfc" opacity="0.92"/>
  <!-- Drop shadow of phone onto monitor -->
  <rect x="25.5" y="14.5" width="10.5" height="15.5" rx="2" fill="#0d2b45" opacity="0.35"/>
  <!-- Foreground Android phone -->
  <rect x="27" y="13" width="17" height="31" rx="2.5" fill="url(#pmBody)"/>
  <path d="M29.5,13 H41.5 A2.5,2.5 0 0,1 44,15.5 V16.2 A2.5,2.5 0 0,0 41.5,13.7 H29.5 A2.5,2.5 0 0,0 27,16.2 V15.5 A2.5,2.5 0 0,1 29.5,13 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M27,41 V41.5 A2.5,2.5 0 0,0 29.5,44 H41.5 A2.5,2.5 0 0,0 44,41.5 V41 A2.5,2.5 0 0,1 41.5,43 H29.5 A2.5,2.5 0 0,1 27,41 Z" fill="#000000" opacity="0.35"/>
  <rect x="29" y="16" width="13" height="24.5" rx="1" fill="url(#pmPhone)"/>
  <circle cx="35.5" cy="14.5" r="0.8" fill="#7f8c8d"/>
  <rect x="33" y="42" width="5" height="1" rx="0.5" fill="#95a5a6"/>
  <!-- Mirroring wave icon on phone screen -->
  <path d="M32,33 A4,4 0 0,1 36,37 M32,29.5 A7.5,7.5 0 0,1 39.5,37" fill="none" stroke="#fcfcfc" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32.5" cy="36.5" r="1.2" fill="#fcfcfc"/>
